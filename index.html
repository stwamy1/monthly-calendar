<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Square Calendar</title>
  <style>
    :root{
      --bg:#070b14;
      --card:#0f1a2f;
      --card2:#0b1426;
      --text:#eaf1ff;
      --muted:#91a1bf;
      --muted2:rgba(234,241,255,.35);
      --border:rgba(255,255,255,.12);
      --btn:rgba(255,255,255,.08);
      --btnHover:rgba(255,255,255,.12);
      --pill:rgba(90,140,255,.25);
      --pillBorder:rgba(120,170,255,.45);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
    }

    httml, body{
      margin:0;
      padding:0;
      width: fit-content;
      height: fit-content;
      background: transparent;
      overflow: hidden;
    }

    body{
      display: inline-block; /* shrink-wrap */
    }

    /* 300x300 square card */
    .card{
      width:280px;
      height:196px;
      border-radius:22px;
      border:1px solid var(--border);
      background:
        radial-gradient(260px 120px at 15% 0%, rgba(255,255,255,.10), transparent 55%),
        linear-gradient(180deg, rgba(255,255,255,.06), transparent 35%),
        linear-gradient(180deg, var(--card), var(--card2));
      box-shadow: 0 16px 38px rgba(0,0,0,.45);
      padding:4px;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .month{
      font-size:12px;
      font-weight:750;
      letter-spacing:.2px;
      white-space:nowrap;
    }

    .controls{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .iconBtn, .todayBtn{
      border:1px solid rgba(255,255,255,.10);
      background:var(--btn);
      color:var(--text);
      border-radius:14px;
      height:18px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
    }
    .iconBtn{
      width:30px;
      font-size:11px;
      line-height:1;
    }
    .todayBtn{
      padding:0 10px;
      font-weight:700;
      font-size:9px;
    }
    .iconBtn:hover, .todayBtn:hover{ background:var(--btnHover); }

    .dow{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:0;
      padding:0 2px;
      color:var(--muted);
      font-size:10px;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    .dow div{ text-align:center; }

    .days{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      row-gap:8px;
      column-gap:0;
      padding:0 2px;
      flex:1;
      align-content:start;
    }

    /* number-only cell */
    .day{
      height:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:650;
      color:var(--text);
      border-radius:999px; /* for pill highlight */
    }
    .other{
      color:var(--muted2);
      font-weight:600;
    }
    .selected{
      background:var(--pill);
      border:1px solid var(--pillBorder);
      box-sizing:border-box;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <div class="month" id="monthLabel">March 2026</div>

      <div class="controls">
        <button class="iconBtn" id="prevBtn" aria-label="Previous month">←</button>
        <button class="todayBtn" id="todayBtn">Today</button>
        <button class="iconBtn" id="nextBtn" aria-label="Next month">→</button>
      </div>
    </div>

    <div class="dow" id="dowRow"></div>
    <div class="days" id="daysGrid"></div>
  </div>

  <script>
    // Monday-first
    const WEEK_START = 1; // 1=Mon
    const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

    // State
    let view = new Date();
    view = new Date(view.getFullYear(), view.getMonth(), 1);

    // Selected day (pill highlight). Default = today if it's in current view, else 1st.
    let selected = null;

    const monthLabel = document.getElementById("monthLabel");
    const dowRow = document.getElementById("dowRow");
    const daysGrid = document.getElementById("daysGrid");

    document.getElementById("prevBtn").addEventListener("click", () => {
      view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
      // keep selected in new month: set to 1
      selected = new Date(view.getFullYear(), view.getMonth(), 1);
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
      selected = new Date(view.getFullYear(), view.getMonth(), 1);
      render();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      const t = new Date();
      view = new Date(t.getFullYear(), t.getMonth(), 1);
      selected = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      render();
    });

    function sameDay(a, b){
      return a && b &&
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    function monthName(d){
      return d.toLocaleString(undefined, { month: "long", year: "numeric" });
    }

    function startOfGrid(monthFirst){
      // monthFirst.getDay(): 0=Sun..6=Sat
      const dow = monthFirst.getDay();
      const offset = (dow - WEEK_START + 7) % 7;
      return new Date(monthFirst.getFullYear(), monthFirst.getMonth(), 1 - offset);
    }

    function render(){
      monthLabel.textContent = monthName(view);

      // Weekday header
      dowRow.innerHTML = "";
      for (const label of DOW){
        const el = document.createElement("div");
        el.textContent = label;
        dowRow.appendChild(el);
      }

      // Default selected if none:
      if (!selected){
        const t = new Date();
        if (t.getFullYear() === view.getFullYear() && t.getMonth() === view.getMonth()){
          selected = new Date(t.getFullYear(), t.getMonth(), t.getDate());
        } else {
          selected = new Date(view.getFullYear(), view.getMonth(), 1);
        }
      }

      // Days (6 weeks = 42)
      const first = new Date(view.getFullYear(), view.getMonth(), 1);
      const gridStart = startOfGrid(first);

      daysGrid.innerHTML = "";

      for (let i = 0; i < 42; i++){
        const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);

        const cell = document.createElement("div");
        cell.className = "day";
        cell.textContent = d.getDate();

        const inMonth = d.getMonth() === view.getMonth();
        if (!inMonth) cell.classList.add("other");

        if (sameDay(d, selected)) cell.classList.add("selected");

        // Click to move pill highlight (like your screenshot)
        cell.addEventListener("click", () => {
          selected = new Date(d.getFullYear(), d.getMonth(), d.getDate());
          // if user clicks a day in previous/next month, switch view to that month
          if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()){
            view = new Date(d.getFullYear(), d.getMonth(), 1);
          }
          render();
        });

        daysGrid.appendChild(cell);
      }
    }

    render();
  </script>
</body>
</html>
